name: Build Shabbat Alarm IPA

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Allows manual trigger directly from GitHub UI

jobs:
  build-ipa:
    name: Build iOS IPA
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode_16.0.app || sudo xcode-select -r
          xcodebuild -version

      - name: Build Archive (Without Signing)
        run: |
          xcodebuild archive \
            -project ShabbatAlarm.xcodeproj \
            -scheme ShabbatAlarm \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath ./build/ShabbatAlarm.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package Payload into IPA
        run: |
          mkdir -p Payload
          cp -r ./build/ShabbatAlarm.xcarchive/Products/Applications/ShabbatAlarm.app Payload/
          zip -r ShabbatAlarm.ipa Payload/
          ls -la ShabbatAlarm.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShabbatAlarm-iOS17-IPA
          path: ShabbatAlarm.ipa
          retention-days: 30
